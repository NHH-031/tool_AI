version: "3.8"

services:
  # ────────────────────────────────────────────────────────────
  # 1. Backend API & Video Rendering Engine (FastAPI + Workers)
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: whiteboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - IMAGE_GENERATOR_PROVIDER=pollinations
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
    volumes:
      - ./output:/app/output
      - ./assets:/app/assets
    depends_on:
      redis:
        condition: service_healthy
    # Cấu hình GPU Passthrough (Tự động kích hoạt khi host có NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]

  # ────────────────────────────────────────────────────────────
  # 2. Frontend Studio User Interface (Next.js 15)
  # ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: whiteboard-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - api

  # ────────────────────────────────────────────────────────────
  # 3. Message Broker & Task Queue (Redis 7)
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local
