<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Whiteboard Line Art: Cluster of Bananas (Bunch) -->
  <g id="banana_bunch" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Crown Stem -->
    <g id="stem">
      <path id="crown_stem" d="M 120 70 L 150 40 L 175 55 L 145 85 Z" fill="#4E6D24" stroke-width="5" />
    </g>

    <!-- Banana Body Cluster -->
    <g id="banana_body">
      <!-- Banana 1 (Bottom Layer) -->
      <path id="banana_1_contour" d="M 130 80 C 190 70, 290 120, 310 240 C 240 180, 160 140, 130 80" />
      <path id="banana_1_tip" d="M 310 240 L 322 250 L 315 255 Z" fill="#3B2616" stroke-width="4" />

      <!-- Banana 2 (Middle Primary) -->
      <path id="banana_2_contour" d="M 135 85 C 205 90, 275 160, 280 290 C 220 220, 150 170, 135 85" />
      <path id="banana_2_tip" d="M 280 290 L 290 302 L 282 307 Z" fill="#3B2616" stroke-width="4" />
      <!-- Ridge Line on Middle Banana -->
      <path id="banana_2_ridge" d="M 140 90 C 205 125, 260 195, 278 285" stroke-width="4" stroke-dasharray="6 4" />

      <!-- Banana 3 (Left Front) -->
      <path id="banana_3_contour" d="M 125 90 C 180 120, 230 200, 210 320 C 170 240, 120 180, 125 90" />
      <path id="banana_3_tip" d="M 210 320 L 216 332 L 208 335 Z" fill="#3B2616" stroke-width="4" />
    </g>
  </g>
</svg>
