<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Elliptical Planetary Orbit Path with Motion Direction -->
  <g id="orbit" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Dashed Elliptical Trajectory -->
    <ellipse cx="400" cy="250" rx="350" ry="180" stroke-dasharray="14 10" />
    <!-- Directional Orbital Arrows -->
    <path d="M 740 230 L 755 250 L 735 265" stroke-width="5" />
    <path d="M 60 270 L 45 250 L 65 235" stroke-width="5" />
    <path d="M 420 70 L 400 65 L 415 85" stroke-width="5" />
    <path d="M 380 430 L 400 435 L 385 415" stroke-width="5" />
  </g>
</svg>
