<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Farmer Bending Down Kneeling to Plant a Seedling -->
  <g id="farmer" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Conical Straw Hat -->
    <path d="M 120 180 L 220 90 L 320 180 Z" fill="#FFFDE7" />
    <path d="M 100 185 Q 220 205 340 185" stroke-width="5" />
    
    <!-- Head Under Hat -->
    <circle cx="220" cy="195" r="30" />
    
    <!-- Torso Bending Forward -->
    <path d="M 230 225 Q 260 280 290 320" stroke-width="7" />
    
    <!-- Arms Reaching Down to Plant Seedling -->
    <path d="M 235 245 Q 220 310 180 380" stroke-width="6" />
    <path d="M 255 245 Q 240 320 200 390" stroke-width="6" />
    <!-- Hands Tending the Soil -->
    <circle cx="175" cy="385" r="10" />
    <circle cx="195" cy="395" r="10" />
    
    <!-- Bent Legs / Kneeling on Ground -->
    <path d="M 290 320 Q 350 360 380 430" stroke-width="7" />
    <path d="M 270 320 Q 300 380 320 440" stroke-width="7" />
    <!-- Boots on Ground -->
    <path d="M 370 430 L 410 435" stroke-width="8" />
    <path d="M 310 440 L 350 445" stroke-width="8" />
  </g>
</svg>
