<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Whiteboard Line Art: Earth with Continents and Lat/Long Lines -->
  <g id="earth" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Globe Outline -->
    <circle cx="200" cy="200" r="160" />
    <!-- Equatorial and Meridian Curves -->
    <path d="M 40 200 Q 200 260 360 200" stroke-dasharray="8 6" />
    <path d="M 200 40 Q 260 200 200 360" />
    <path d="M 200 40 Q 140 200 200 360" />
    <!-- Simplified Continents -->
    <path d="M 120 120 Q 160 100 190 140 Q 170 180 130 170 Z" fill="#E8F5E9" />
    <path d="M 220 130 Q 270 120 290 170 Q 260 210 230 180 Z" fill="#E8F5E9" />
    <path d="M 150 220 Q 190 220 180 280 Q 140 300 130 250 Z" fill="#E8F5E9" />
    <path d="M 250 230 Q 300 240 290 310 Q 240 290 250 230 Z" fill="#E8F5E9" />
  </g>
</svg>
