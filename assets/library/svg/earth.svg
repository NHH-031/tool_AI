<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <!-- Tilted Earth globe with continents and equator in whiteboard line-art style -->
  <g id="earth" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Earth sphere -->
    <circle cx="160" cy="160" r="110" />

    <!-- Axial tilt axis (23.5 degrees) -->
    <line x1="120" y1="20" x2="200" y2="300" stroke-width="4" stroke-dasharray="8 6" />

    <!-- Equator ellipse -->
    <ellipse cx="160" cy="160" rx="110" ry="32" transform="rotate(-23.5 160 160)" stroke-width="4" />

    <!-- Continents outline -->
    <!-- North / South America shape -->
    <path d="M 120 95 Q 135 110 130 135 Q 115 150 120 170 Q 135 190 140 220 Q 130 240 125 245" stroke-width="5" />
    
    <!-- Eurasia / Africa shape -->
    <path d="M 175 90 Q 210 95 230 115 Q 215 140 205 160 Q 220 185 210 225 Q 190 230 180 205 Q 170 170 180 140 Z" stroke-width="5" />

    <!-- Mini Moon in orbit -->
    <circle cx="295" cy="75" r="18" stroke-width="5" />
    <path d="M 292 70 A 10 10 0 0 0 302 85" stroke-width="3" />
    <!-- Moon orbit dotted streak -->
    <path d="M 270 95 Q 285 85 305 60" stroke-width="3" stroke-dasharray="4 4" />
  </g>
</svg>
