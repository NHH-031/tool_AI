<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Whiteboard Line Art: Kinetic Molecules with Velocity Arrows -->
  <g id="molecules_diagram" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Enclosing Chamber Box (Glass Beaker/Box) -->
    <rect x="40" y="30" width="520" height="380" rx="10" stroke-width="8" stroke-dasharray="16 8" />

    <!-- Molecule 1 (Top Left, moving fast right-down) -->
    <circle cx="140" cy="120" r="28" fill="#BEE3F8" />
    <line x1="170" y1="135" x2="240" y2="170" stroke-width="6" stroke="#2B6CB0" />
    <polyline points="225,155 240,170 215,180" stroke-width="5" stroke="#2B6CB0" />

    <!-- Molecule 2 (Center, bouncing upward) -->
    <circle cx="300" cy="220" r="28" fill="#BEE3F8" />
    <line x1="300" y1="190" x2="300" y2="100" stroke-width="6" stroke="#2B6CB0" />
    <polyline points="290,115 300,100 310,115" stroke-width="5" stroke="#2B6CB0" />

    <!-- Molecule 3 (Top Right, moving left) -->
    <circle cx="450" cy="110" r="28" fill="#BEE3F8" />
    <line x1="420" y1="110" x2="350" y2="110" stroke-width="6" stroke="#2B6CB0" />
    <polyline points="365,100 350,110 365,120" stroke-width="5" stroke="#2B6CB0" />

    <!-- Molecule 4 (Bottom Left, bouncing off wall) -->
    <circle cx="120" cy="300" r="28" fill="#BEE3F8" />
    <line x1="145" y1="310" x2="220" y2="340" stroke-width="6" stroke="#2B6CB0" />
    <polyline points="205,325 220,340 195,350" stroke-width="5" stroke="#2B6CB0" />

    <!-- Molecule 5 (Bottom Right, high velocity) -->
    <circle cx="430" cy="320" r="28" fill="#BEE3F8" />
    <line x1="400" y1="310" x2="320" y2="280" stroke-width="6" stroke="#2B6CB0" />
    <polyline points="335,270 320,280 345,295" stroke-width="5" stroke="#2B6CB0" />

    <!-- Vibration Streak Wiggles -->
    <path d="M 110 90 Q 115 80 110 70" stroke-width="3" />
    <path d="M 270 240 Q 260 250 250 240" stroke-width="3" />
    <path d="M 470 340 Q 480 350 490 340" stroke-width="3" />
  </g>
</svg>
