<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Whiteboard Line Art: Blackboard with Mathematics Equations -->
  <g id="blackboard_math" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Board Outer Frame -->
    <rect x="30" y="30" width="540" height="300" rx="8" stroke-width="8" />
    <line x1="20" y1="335" x2="580" y2="335" stroke-width="10" />

    <!-- Math Equations & Geometric Chart -->
    <g stroke-width="4">
      <!-- Pythagorean Theorem -->
      <path d="M 70 80 L 70 140 L 150 140 Z" />
      <text x="80" y="180" font-family="sans-serif" font-size="24" stroke="none" fill="#1A1A1A">a² + b² = c²</text>

      <!-- Function Graph -->
      <line x1="260" y1="80" x2="260" y2="200" stroke-width="3" />
      <line x1="260" y1="180" x2="380" y2="180" stroke-width="3" />
      <path d="M 270 170 Q 310 160 330 110 T 370 70" stroke-width="4" stroke="#2B6CB0" />
      <text x="280" y="230" font-family="sans-serif" font-size="20" stroke="none" fill="#1A1A1A">f(x) = x² + 2x</text>

      <!-- Calculus / Matrix -->
      <text x="430" y="110" font-family="sans-serif" font-size="28" stroke="none" fill="#1A1A1A">∫ f(x) dx</text>
      <text x="430" y="170" font-family="sans-serif" font-size="24" stroke="none" fill="#1A1A1A">E = mc²</text>
    </g>

    <!-- Wooden Stand Legs -->
    <line x1="120" y1="335" x2="90" y2="390" stroke-width="8" />
    <line x1="480" y1="335" x2="510" y2="390" stroke-width="8" />
  </g>
</svg>
