<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <!-- High-Aesthetic Whiteboard Art: Fierce Athletic Tiger Leaping in Full Chase (Disney/Ghibli Quality) -->
  <g id="tiger_running" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Long Energetic Whipping S-Curved Tail -->
    <path d="M 115 220 C 70 200, 35 140, 50 85 C 62 48, 98 48, 88 88 C 76 130, 95 175, 130 208" stroke-width="7" />
    <!-- Tail Stripes / Rings -->
    <path d="M 52 105 C 64 112, 75 114, 76 106" stroke-width="5" stroke="#EA580C" />
    <path d="M 62 135 C 75 144, 86 146, 88 138" stroke-width="5" stroke="#1A1A1A" />
    <path d="M 76 165 C 92 174, 104 175, 106 166" stroke-width="5" stroke="#EA580C" />
    <path d="M 95 192 C 112 200, 122 200, 124 192" stroke-width="5" stroke="#1A1A1A" />

    <!-- Powerful Muscular Spine & Back Arc (Leaping Athletic Sprint) -->
    <path d="M 130 208 C 180 178, 255 170, 340 182 C 395 192, 440 180, 480 148" stroke-width="7" />

    <!-- Deep Muscular Chest & Tucked Aerodynamic Flank -->
    <path d="M 210 280 C 268 270, 330 258, 388 280 C 440 298, 475 268, 495 224" stroke-width="7" />

    <!-- HIND LEFT LEG (Extended Far Backward in Full Propulsion) -->
    <!-- Thigh Muscle & Hock -->
    <path d="M 155 205 C 120 240, 85 290, 45 330 C 30 345, 15 355, -2 360" stroke-width="7" />
    <path d="M 175 225 C 142 262, 110 310, 70 345 L 18 368" stroke-width="6" />
    <!-- Rear Left Paw with Claws & Pads -->
    <path d="M -2 360 C -8 366, 5 374, 22 370" stroke-width="8" />
    <path d="M -5 355 L -12 358 M 4 366 L -2 374 M 14 368 L 10 376" stroke-width="4" />

    <!-- HIND RIGHT LEG (Coiled Springing Stride) -->
    <path d="M 185 215 C 158 252, 134 300, 100 348 C 88 365, 74 378, 58 385" stroke-width="7" />
    <path d="M 205 235 C 178 272, 150 320, 118 362 L 78 390" stroke-width="6" />
    <!-- Rear Right Paw -->
    <path d="M 58 385 C 52 392, 68 398, 86 392" stroke-width="8" />

    <!-- FORE LEFT LEG (Lunging Forward in Predatory Reach) -->
    <!-- Muscular Shoulder & Forearm -->
    <path d="M 450 210 C 495 242, 545 280, 595 312 C 618 328, 638 335, 660 338" stroke-width="7.5" />
    <path d="M 468 226 C 510 258, 555 290, 605 320 L 655 344" stroke-width="6.5" />
    <!-- Fore Left Paw & Extended Razor Claws -->
    <path d="M 660 338 C 672 340, 674 332, 662 325" stroke-width="8" />
    <path d="M 666 328 L 678 325 M 670 336 L 682 334 M 662 342 L 674 346" stroke-width="4.5" />

    <!-- FORE RIGHT LEG (Mid-Bound Ground Pounce) -->
    <path d="M 425 225 C 462 262, 505 305, 545 348 C 565 370, 582 384, 608 392" stroke-width="7" />
    <path d="M 445 242 C 480 278, 518 318, 555 358 L 600 395" stroke-width="6" />
    <!-- Fore Right Paw -->
    <path d="M 608 392 C 618 395, 622 386, 610 382" stroke-width="8" />

    <!-- Muscular Neck & Throat -->
    <path d="M 480 148 C 498 128, 515 110, 532 95" stroke-width="7" />
    <path d="M 495 224 C 522 196, 538 168, 550 140" stroke-width="7" />

    <!-- FIERCE ROARING TIGER HEAD & SNOUT PROFILE -->
    <!-- Forehead & Snout Bridge -->
    <path d="M 532 95 C 555 72, 590 68, 620 84 C 646 98, 662 108, 678 116" stroke-width="7" />
    <!-- Nose Tip & Whisker Pad -->
    <path d="M 678 116 C 686 122, 688 130, 680 138 C 668 146, 648 152, 620 150" stroke-width="6" />
    <path d="M 678 118 C 684 122, 684 130, 676 132 Z" fill="#1A1A1A" />

    <!-- Wide Roaring Open Mouth & Razor Fangs -->
    <path d="M 620 150 C 598 152, 582 164, 565 172" stroke-width="6" />
    <!-- Upper Deadly Canines -->
    <path d="M 650 148 L 642 170 L 634 150" stroke-width="5" fill="#FFFFFF" />
    <!-- Lower Sharp Canines -->
    <path d="M 592 195 L 600 176 L 608 192" stroke-width="5" fill="#FFFFFF" />
    <!-- Panting / Roaring Pink/Red Tongue Accent -->
    <path d="M 605 155 C 628 175, 622 198, 600 204 C 582 208, 576 186, 582 166" stroke="#E11D48" stroke-width="5" fill="#E11D48" />

    <!-- Alert Rounded Tiger Ears (Tilted Back in Full Charge) -->
    <path d="M 552 82 C 530 62, 502 68, 492 90 C 486 106, 498 118, 525 112" stroke-width="6" />
    <!-- Inner Ear Warm Amber Accent -->
    <path d="M 520 85 C 508 76, 500 84, 502 95" stroke="#EA580C" stroke-width="4.5" />

    <!-- Intense Focused Predator Eyes & Furrowed Brow -->
    <circle cx="595" cy="100" r="7" fill="#1A1A1A" />
    <circle cx="597" cy="98" r="2.5" fill="#FFFFFF" />
    <path d="M 578 90 C 596 84, 614 86, 624 92" stroke-width="5.5" />
    <!-- Fierce Whisker Tufts -->
    <path d="M 645 136 C 668 142, 686 144, 694 144" stroke-width="3" />
    <path d="M 640 145 C 664 154, 682 160, 690 162" stroke-width="3" />
    <path d="M 635 152 C 655 166, 672 176, 680 182" stroke-width="3" />

    <!-- BOLD ICONIC TIGER STRIPES (Graphic Whiteboard Accents) -->
    <!-- Shoulder Stripes -->
    <path d="M 445 180 C 430 208, 424 235, 435 258" stroke-width="6.5" stroke="#EA580C" />
    <path d="M 468 168 C 456 196, 458 224, 470 242" stroke-width="6.5" stroke="#1A1A1A" />
    <!-- Torso & Flank Stripes -->
    <path d="M 345 186 C 328 214, 322 242, 334 265" stroke-width="7" stroke="#1A1A1A" />
    <path d="M 380 184 C 362 212, 358 238, 368 260" stroke-width="6.5" stroke="#EA580C" />
    <path d="M 295 184 C 278 214, 272 240, 284 265" stroke-width="7" stroke="#1A1A1A" />
    <path d="M 250 188 C 236 214, 232 240, 244 268" stroke-width="6.5" stroke="#EA580C" />
    <path d="M 205 198 C 194 224, 192 248, 204 272" stroke-width="7" stroke="#1A1A1A" />
    <!-- Leg Stripes -->
    <path d="M 500 236 C 516 248, 528 250, 532 242" stroke-width="5" stroke="#EA580C" />
    <path d="M 538 264 C 555 276, 566 278, 570 270" stroke-width="5" stroke="#1A1A1A" />

    <!-- HIGH-SPEED MOTION & IMPACT LINES -->
    <!-- Ground Dust Clouds Behind Paws -->
    <path d="M -15 375 C 5 368, 30 370, 42 375" stroke-width="4" stroke-dasharray="8 6" />
    <path d="M 35 395 C 60 388, 90 392, 108 395" stroke-width="4.5" stroke-dasharray="10 8" />
    <!-- Aerodynamic Wind Streaks Above Spine -->
    <path d="M 230 152 C 275 146, 320 150, 365 152" stroke-width="4" stroke-dasharray="14 10" />
    <path d="M 168 170 C 202 164, 238 166, 268 170" stroke-width="4" stroke-dasharray="10 8" />
  </g>
</svg>
