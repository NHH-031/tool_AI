<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Whiteboard Line Art: Financial Price Tag and Market Index -->
  <g id="price_chart" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hanging Price Tag -->
    <path d="M 140 100 L 260 100 L 340 180 L 220 300 L 100 220 Z" fill="#FFFDE7" />
    <circle cx="160" cy="140" r="14" fill="#FFFFFF" />
    <path d="M 160 126 Q 160 80 200 60" stroke-width="4" stroke-dasharray="6 4" />
    <!-- Dollar / Currency Symbol on Tag -->
    <path d="M 220 180 Q 195 180 195 200 Q 195 220 220 225 Q 245 230 245 250 Q 245 270 220 270" stroke-width="6" />
    <path d="M 220 165 L 220 285" stroke-width="6" />
  </g>
</svg>
