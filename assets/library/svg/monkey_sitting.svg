<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Monkey Sitting Pose -->
  <g id="monkey_sitting" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tail (Curled flat on ground) -->
    <path d="M 190 410 C 130 430, 80 400, 80 350 C 80 300, 130 300, 130 340 C 130 370, 110 380, 100 365" />

    <!-- Legs (Crossed/Folded in front) -->
    <path d="M 180 390 Q 150 430 180 450 Q 230 460 250 440" />
    <path d="M 320 390 Q 350 430 320 450 Q 270 460 250 440" />

    <!-- Body Torso -->
    <ellipse cx="250" cy="330" rx="65" ry="85" />
    <ellipse cx="250" cy="340" rx="40" ry="55" stroke-dasharray="4 2" />

    <!-- Left Arm (Hand resting on knee) -->
    <path d="M 190 280 Q 170 340 190 420" />
    <circle cx="190" cy="425" r="10" />

    <!-- Right Arm (Hand scratching head) -->
    <path d="M 310 280 Q 370 230 330 140 L 300 135" />
    <circle cx="300" cy="135" r="10" />

    <!-- Head Outline -->
    <circle cx="250" cy="165" r="68" />

    <!-- Left Ear -->
    <path d="M 185 150 C 150 140, 150 190, 185 185" />
    <!-- Right Ear -->
    <path d="M 315 150 C 350 140, 350 190, 315 185" />

    <!-- Face Mask -->
    <path d="M 210 145 C 210 125, 250 125, 250 150 C 250 125, 290 125, 290 145 C 290 185, 210 185, 210 145 Z" />

    <!-- Eyes (Puzzled / Thinking expression) -->
    <circle cx="230" cy="148" r="5" fill="#1A1A1A" />
    <circle cx="270" cy="148" r="5" fill="#1A1A1A" />

    <!-- Snout & Mouth (Curious smirk) -->
    <ellipse cx="250" cy="180" rx="28" ry="18" />
    <path d="M 240 185 Q 255 185 265 180" />
  </g>
</svg>
