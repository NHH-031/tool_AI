<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Whiteboard Line Art: Boiling Water Pot / Container with Liquid Surface -->
  <g id="water" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Beaker / Pan Body -->
    <path d="M 100 120 L 100 320 Q 100 360 140 360 L 360 360 Q 400 360 400 320 L 400 120" />
    <path d="M 80 120 L 420 120" stroke-width="6" />
    <!-- Water Level and Waves -->
    <path d="M 110 200 Q 150 185 190 200 T 270 200 T 350 200 T 390 200" stroke-width="4" />
    <path d="M 120 230 Q 160 215 200 230 T 280 230 T 360 230" stroke-width="3" />
    <!-- Boiling Bubbles inside Water -->
    <circle cx="180" cy="270" r="14" />
    <circle cx="250" cy="300" r="18" />
    <circle cx="320" cy="260" r="12" />
    <circle cx="210" cy="220" r="8" />
    <circle cx="290" cy="210" r="10" />
  </g>
</svg>
