<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Inflation Metaphor (Price Tag Balloon Rising) -->
  <g id="inflation_balloon" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Big Inflated Hot Air Balloon -->
    <path d="M 180 320 Q 80 230 110 130 Q 150 20 250 20 Q 350 20 390 130 Q 420 230 320 320 Z" fill="#FED7D7" stroke-width="8" />
    
    <!-- Balloon Stripes -->
    <path d="M 250 20 Q 200 160 210 320" stroke-width="4" stroke-dasharray="8 6" />
    <path d="M 250 20 Q 300 160 290 320" stroke-width="4" stroke-dasharray="8 6" />

    <!-- Price Tag Symbol on Balloon -->
    <circle cx="250" cy="160" r="60" fill="#FFF5F5" stroke-width="5" />
    <text x="220" y="180" font-family="sans-serif" font-size="60" font-weight="bold" stroke="none" fill="#E53E3E">$$$</text>

    <!-- Upward Skyrocket Arrow -->
    <line x1="390" y1="280" x2="450" y2="120" stroke-width="8" stroke="#E53E3E" />
    <polyline points="420,120 450,120 450,150" stroke-width="8" stroke="#E53E3E" />
    <text x="400" y="90" font-family="sans-serif" font-size="28" font-weight="bold" stroke="none" fill="#E53E3E">+ 15%</text>

    <!-- Ropes to Basket -->
    <line x1="210" y1="320" x2="220" y2="400" stroke-width="4" />
    <line x1="290" y1="320" x2="280" y2="400" stroke-width="4" />

    <!-- Basket (Hanging Below) -->
    <rect x="220" y="400" width="60" height="50" rx="5" fill="#ED8936" />
    <line x1="220" y1="425" x2="280" y2="425" stroke-width="3" />
  </g>
</svg>
