<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Monkey Climbing Pose -->
  <g id="monkey_climbing" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tree Trunk Segment Reference (Dotted Guide) -->
    <g id="tree_guide">
      <path id="guide_trunk_l" d="M 340 20 L 340 480" stroke-width="8" stroke="#7A5C3D" />
      <path id="guide_trunk_r" d="M 370 20 L 370 480" stroke-width="8" stroke="#7A5C3D" />
      <path id="guide_ring_1" d="M 340 100 Q 355 105 370 100" stroke-width="4" stroke="#7A5C3D" />
      <path id="guide_ring_2" d="M 340 220 Q 355 225 370 220" stroke-width="4" stroke="#7A5C3D" />
      <path id="guide_ring_3" d="M 340 360 Q 355 365 370 360" stroke-width="4" stroke="#7A5C3D" />
    </g>

    <!-- Tail Wrapped around Trunk -->
    <g id="tail">
      <path id="tail_wrap" d="M 210 360 C 170 390, 160 440, 200 460 C 240 480, 310 450, 330 400 C 345 370, 375 370, 380 400" />
    </g>

    <!-- Arms (Reaching & Gripping Trunk) -->
    <g id="arms">
      <!-- Upper Arm Reaching High on Trunk -->
      <path id="arm_upper" d="M 230 200 Q 280 150 340 130" />
      <ellipse id="hand_upper" cx="345" cy="130" rx="12" ry="8" />

      <!-- Lower Arm Gripping Trunk -->
      <path id="arm_lower" d="M 240 240 Q 290 230 338 235" />
      <ellipse id="hand_lower" cx="343" cy="235" rx="12" ry="8" />
    </g>

    <!-- Legs (Climbing & Supporting on Trunk) -->
    <g id="legs">
      <!-- Upper Leg (Bent Climbing Knee) -->
      <path id="leg_upper" d="M 220 300 Q 260 270 300 290 L 340 300" />
      <ellipse id="foot_upper" cx="345" cy="300" rx="12" ry="8" />

      <!-- Lower Leg Supporting on Trunk -->
      <path id="leg_lower" d="M 210 330 Q 250 350 310 360 L 340 370" />
      <ellipse id="foot_lower" cx="345" cy="370" rx="12" ry="8" />
    </g>

    <!-- Body Torso (Tilted 30 degrees towards tree) -->
    <g id="body">
      <ellipse id="body_torso" cx="220" cy="270" rx="55" ry="75" transform="rotate(15 220 270)" />
      <!-- Belly Outline -->
      <ellipse id="belly_patch" cx="230" cy="275" rx="35" ry="50" transform="rotate(15 230 275)" stroke-dasharray="4 2" />
    </g>

    <!-- Head & Ears (Tilted looking up towards top of tree) -->
    <g id="head">
      <circle id="head_outline" cx="215" cy="140" r="58" />
      <!-- Left Ear -->
      <path id="ear_left" d="M 160 135 C 130 130, 130 170, 160 165" />
      <!-- Right Ear -->
      <path id="ear_right" d="M 270 120 C 300 115, 300 155, 270 150" />
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Face Mask Contour -->
      <path id="face_mask" d="M 180 125 C 180 110, 215 110, 215 130 C 215 110, 250 110, 250 125 C 250 160, 180 160, 180 125 Z" />
      <!-- Eyes (Looking upwards & right) -->
      <circle id="eye_left" cx="205" cy="125" r="5" fill="#1A1A1A" />
      <circle id="eye_right" cx="240" cy="122" r="5" fill="#1A1A1A" />
      <!-- Snout & Focused Smile -->
      <ellipse id="snout" cx="225" cy="155" rx="25" ry="16" />
      <path id="mouth_smile" d="M 215 160 Q 225 170 238 160" />
    </g>
  </g>
</svg>
