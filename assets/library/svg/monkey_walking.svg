<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Monkey Walking Pose -->
  <g id="monkey_walking" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tail (Curled High) -->
    <path d="M 140 280 C 80 250, 70 170, 110 140 C 140 120, 170 150, 150 180" />

    <!-- Back Left Leg (Stepping Forward) -->
    <path d="M 170 300 Q 150 370 140 430 L 120 440" />
    <!-- Back Right Leg (Trailing) -->
    <path d="M 210 290 Q 230 360 250 430 L 270 435" />

    <!-- Body Torso (Horizontal Walk) -->
    <ellipse cx="230" cy="270" rx="85" ry="55" transform="rotate(-10 230 270)" />

    <!-- Front Left Arm (Planted) -->
    <path d="M 280 260 Q 290 340 300 430 L 320 435" />
    <!-- Front Right Arm (Reaching Forward) -->
    <path d="M 310 250 Q 360 320 390 410 L 410 415" />

    <!-- Head Outline -->
    <circle cx="360" cy="180" r="55" />
    <!-- Ears -->
    <path d="M 330 150 C 310 135, 310 175, 335 170" />
    <path d="M 380 140 C 400 125, 410 165, 385 160" />

    <!-- Eyes (Looking forward) -->
    <circle cx="365" cy="175" r="5" fill="#1A1A1A" />
    <circle cx="390" cy="175" r="5" fill="#1A1A1A" />

    <!-- Snout & Smile -->
    <ellipse cx="380" cy="195" rx="22" ry="14" />
    <path d="M 370 200 Q 380 208 392 200" />
  </g>
</svg>
