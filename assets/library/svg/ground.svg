<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Whiteboard Line Art: Fertile Ground and Soil Horizon with Seedling Hole -->
  <g id="ground" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Horizon Line -->
    <path d="M 40 180 Q 200 170 400 180 T 760 175" stroke-width="7" />
    <!-- Secondary Soil Contour -->
    <path d="M 60 210 Q 250 200 480 215 T 740 205" stroke-width="4" />
    <!-- Soil Clods and Texture -->
    <ellipse cx="220" cy="195" rx="20" ry="10" />
    <ellipse cx="380" cy="195" rx="25" ry="12" />
    <ellipse cx="560" cy="200" rx="18" ry="9" />
    <!-- Small Grass Tufts -->
    <path d="M 120 180 L 115 160 M 120 180 L 125 155 M 120 180 L 132 165" stroke-width="4" />
    <path d="M 650 175 L 645 155 M 650 175 L 655 150 M 650 175 L 662 160" stroke-width="4" />
  </g>
</svg>
