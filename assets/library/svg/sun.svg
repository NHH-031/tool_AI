<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Sun with radiant rays in whiteboard line-art style -->
  <g id="sun" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center solar sphere -->
    <circle cx="200" cy="200" r="85" />
    
    <!-- Primary cardinal rays -->
    <line x1="200" y1="95" x2="200" y2="40" stroke-width="7" />
    <line x1="200" y1="305" x2="200" y2="360" stroke-width="7" />
    <line x1="95" y1="200" x2="40" y2="200" stroke-width="7" />
    <line x1="305" y1="200" x2="360" y2="200" stroke-width="7" />

    <!-- Diagonal rays -->
    <line x1="126" y1="126" x2="85" y2="85" stroke-width="6" />
    <line x1="274" y1="126" x2="315" y2="85" stroke-width="6" />
    <line x1="126" y1="274" x2="85" y2="315" stroke-width="6" />
    <line x1="274" y1="274" x2="315" y2="315" stroke-width="6" />

    <!-- Intermediate subtle rays -->
    <line x1="200" y1="80" x2="200" y2="60" stroke-width="4" />
    <line x1="200" y1="320" x2="200" y2="340" stroke-width="4" />
    <line x1="80" y1="200" x2="60" y2="200" stroke-width="4" />
    <line x1="320" y1="200" x2="340" y2="200" stroke-width="4" />
  </g>
</svg>
