<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Whiteboard Line Art: Monkey Jumping Pose -->
  <g id="monkey_jumping" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Motion Action Lines Behind -->
    <path d="M 80 380 L 140 330" stroke-width="3" stroke-dasharray="8 6" />
    <path d="M 90 420 L 160 370" stroke-width="3" stroke-dasharray="8 6" />
    <path d="M 120 450 L 190 410" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Tail (Trailing Dynamically in Air) -->
    <path d="M 160 270 C 100 290, 70 230, 90 170 C 100 130, 150 140, 140 180" />

    <!-- Trailing Left Leg -->
    <path d="M 180 290 Q 150 360 130 420 L 110 430" />
    <!-- Trailing Right Leg -->
    <path d="M 210 280 Q 180 340 170 410 L 150 420" />

    <!-- Torso Leaping Forward-Upward (Tilted 35 deg) -->
    <ellipse cx="250" cy="240" rx="80" ry="55" transform="rotate(-35 250 240)" />

    <!-- Reaching Left Arm (Forward) -->
    <path d="M 310 190 Q 380 150 430 110" />
    <circle cx="435" cy="105" r="10" />

    <!-- Reaching Right Arm (Upward) -->
    <path d="M 290 170 Q 340 110 390 70" />
    <circle cx="395" cy="65" r="10" />

    <!-- Head (Eager expression looking at target) -->
    <circle cx="330" cy="150" r="56" />
    <path d="M 300 120 C 280 105, 280 145, 305 140" />
    <path d="M 360 110 C 380 95, 390 135, 365 130" />

    <!-- Eyes (Wide Excited) -->
    <circle cx="335" cy="140" r="5" fill="#1A1A1A" />
    <circle cx="360" cy="140" r="5" fill="#1A1A1A" />

    <!-- Snout & Big Smile -->
    <ellipse cx="350" cy="165" rx="24" ry="16" />
    <path d="M 340 170 Q 355 182 370 170" />
  </g>
</svg>
