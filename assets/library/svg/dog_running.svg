<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- High-Quality Whiteboard Line Art: Expressive Dog Running in Full Stride -->
  <g id="dog_running" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Wagging Tail (Curved with High Energy) -->
    <path d="M 120 200 C 90 170, 70 120, 95 80 C 110 55, 135 65, 125 95 C 115 125, 125 165, 140 195" />

    <!-- Spine & Back Contours (Natural Athletic Curve) -->
    <path d="M 140 195 C 180 185, 230 180, 290 190 C 330 195, 360 185, 385 160" />

    <!-- Chest & Belly (Tucked-in Grey/Hound Style Athletic Flank) -->
    <path d="M 195 255 C 235 250, 275 240, 310 255 C 345 270, 375 250, 390 220" />

    <!-- Powerful Hind Left Leg (Extended Far Backwards in Running Stride) -->
    <path d="M 160 190 C 130 220, 100 260, 70 290 C 55 305, 45 315, 35 320" />
    <path d="M 175 210 C 150 240, 120 280, 85 305 L 45 322" />
    <!-- Rear Left Paw with Claws/Pads -->
    <path d="M 35 320 C 30 325, 40 330, 50 325" />

    <!-- Powerful Hind Right Leg (Trailing Stride) -->
    <path d="M 180 195 C 160 230, 140 270, 115 310 C 105 325, 95 335, 85 340" />
    <path d="M 195 215 C 175 250, 150 290, 125 325 L 95 342" />
    <path d="M 85 340 C 80 345, 90 350, 100 345" />

    <!-- Front Left Leg (Reaching Far Forward in High Motion) -->
    <path d="M 365 200 C 400 230, 440 260, 480 290 C 500 305, 520 315, 540 320" />
    <path d="M 380 215 C 415 245, 450 275, 490 300 L 535 322" />
    <!-- Front Left Paw -->
    <path d="M 540 320 C 550 322, 555 318, 545 312" />

    <!-- Front Right Leg (Mid-Step Forward Arch) -->
    <path d="M 345 210 C 375 245, 410 280, 440 315 C 455 330, 470 340, 490 345" />
    <path d="M 360 225 C 390 255, 420 290, 450 322 L 485 346" />
    <path d="M 490 345 C 500 347, 505 342, 495 338" />

    <!-- Neck & Cheerful Red Collar (Concept Accent Color) -->
    <path d="M 385 160 C 395 140, 405 125, 415 110" />
    <path d="M 390 220 C 410 195, 420 170, 428 150" />
    <!-- Accent Color Collar: Red #E05A47 -->
    <path d="M 405 140 L 435 155 L 428 175 L 398 160 Z" stroke="#E05A47" stroke-width="7" fill="#E05A47" />
    <!-- Collar Tag Charm -->
    <circle cx="430" cy="182" r="6" stroke="#E67E22" stroke-width="4" fill="#E67E22" />

    <!-- Head & Muzzle (Joyful Dog Silhouette) -->
    <path d="M 415 110 C 430 90, 460 85, 485 100 C 510 115, 525 125, 550 135" />
    <!-- Nose Tip -->
    <path d="M 550 135 C 558 139, 560 148, 552 153 C 542 160, 525 165, 500 162" />
    <circle cx="552" cy="143" r="5" fill="#1A1A1A" />

    <!-- Cheerful Open Mouth & Panting Pink Tongue -->
    <path d="M 500 162 C 480 162, 465 170, 450 175" />
    <path d="M 490 165 C 505 185, 500 205, 485 212 C 472 218, 465 200, 470 172" stroke="#E05A47" stroke-width="5" fill="#E05A47" />

    <!-- Flapping Floppy Ear (Flying Backwards in the Wind) -->
    <path d="M 435 98 C 400 80, 360 85, 340 110 C 330 125, 340 140, 370 135 C 400 130, 420 120, 440 112" />

    <!-- Expressive Eye & Brow (Focused Forward on Ball) -->
    <circle cx="475" cy="112" r="5" fill="#1A1A1A" />
    <path d="M 465 102 C 475 98, 485 100, 490 104" stroke-width="4" />

    <!-- Speed / Motion Whiskers & Dust Lines Behind Paws -->
    <path d="M 40 340 C 20 345, 10 350, 0 350" stroke-width="4" stroke-dasharray="8 6" />
    <path d="M 90 360 C 70 365, 55 368, 45 368" stroke-width="4" stroke-dasharray="8 6" />
  </g>
</svg>
