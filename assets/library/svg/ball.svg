<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- High-Quality Whiteboard Line Art: Bouncing & Rolling Ball with Motion Lines -->
  <g id="ball" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ball Outer Silhouette -->
    <circle cx="170" cy="150" r="80" />

    <!-- Classic Geometric Seams: Central Pentagon -->
    <!-- Red Accent Patch (#E05A47) on one facet for whiteboard pop -->
    <polygon points="170,120 195,138 185,168 155,168 145,138" stroke="#1A1A1A" stroke-width="5" fill="#E05A47" />

    <!-- Radiating Seam Lines to Outer Edges -->
    <path d="M 170 120 L 170 80" />
    <path d="M 195 138 L 235 130" />
    <path d="M 185 168 L 210 205" />
    <path d="M 155 168 L 130 205" />
    <path d="M 145 138 L 105 130" />

    <!-- Outer Facet Edges -->
    <path d="M 170 80 C 205 85, 230 105, 235 130" />
    <path d="M 235 130 C 245 160, 235 185, 210 205" />
    <path d="M 210 205 C 185 225, 155 225, 130 205" />
    <path d="M 130 205 C 105 185, 95 160, 105 130" />
    <path d="M 105 130 C 110 105, 135 85, 170 80" />

    <!-- Dynamic Motion / Rolling Arcs Behind the Ball -->
    <path d="M 60 110 C 75 130, 75 170, 60 190" stroke-width="5" />
    <path d="M 40 125 C 50 140, 50 160, 40 175" stroke-width="5" />
    <path d="M 70 230 C 95 240, 125 240, 150 235" stroke-width="4" stroke-dasharray="10 8" />
    <path d="M 40 245 C 70 255, 110 255, 140 250" stroke-width="4" stroke-dasharray="10 8" />
  </g>
</svg>
