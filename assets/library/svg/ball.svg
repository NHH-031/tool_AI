<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Whiteboard Line Art: Bouncing Tennis Ball with Motion Lines -->
  <g id="ball" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ball Outline -->
    <circle cx="100" cy="100" r="60" />
    <!-- Seams / Curves of Ball -->
    <path d="M 60 70 Q 100 100 60 130" />
    <path d="M 140 70 Q 100 100 140 130" />
    <!-- Motion Action Marks -->
    <path d="M 30 140 Q 20 150 15 170" stroke-width="3" />
    <path d="M 50 160 Q 45 175 40 190" stroke-width="3" />
  </g>
</svg>
